<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set a new password — Relay</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#0E2A52; --navy-3:#1E4F94; --ink:#101828; --ink-soft:#5C6577; --bg:#F5F7FA;
    --amber:#F5A623; --line:rgba(16,24,40,0.10); }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:linear-gradient(160deg, var(--navy) 0%, var(--navy-3) 100%);
    color:#fff; font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px; }
  h1{ font-family:'Fredoka',sans-serif; font-weight:600; margin:0; font-size:1.4rem; color:var(--ink); }
  .card{ max-width:400px; width:100%; background:#fff; color:var(--ink); border-radius:24px;
    padding:40px 30px; text-align:center; box-shadow:0 24px 48px -20px rgba(0,0,0,0.35); }

  .mark{ width:44px; height:44px; margin:0 auto 22px; border-radius:38% 62% 60% 40% / 45% 40% 60% 55%;
    background:var(--amber); animation:bounce 1.1s ease-in-out infinite; }
  @keyframes bounce{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-14px);} }
  .check{ width:56px; height:56px; margin:0 auto 20px; border-radius:50%; background:#E7F7EE; color:#0F6B3C;
    display:flex; align-items:center; justify-content:center; }
  .err-icon{ background:#FDECEC; color:#B3261E; }

  p{ color:var(--ink-soft); margin-top:10px; font-size:0.96rem; line-height:1.55; }
  label{ display:block; text-align:left; font-size:0.85rem; font-weight:600; color:var(--ink); margin:18px 0 8px; }
  input{ width:100%; padding:14px 16px; border-radius:14px; border:1.5px solid var(--line);
    font-size:0.98rem; font-family:'Inter',sans-serif; color:var(--ink); background:var(--bg); outline:none; }
  input:focus{ border-color:var(--navy-3); background:#fff; }
  .btn{ display:flex; align-items:center; justify-content:center; width:100%; margin-top:22px; padding:14px 20px;
    border-radius:14px; border:none; background:var(--navy); color:#fff; text-decoration:none;
    font-weight:700; font-size:0.95rem; cursor:pointer; }
  .btn:hover{ background:var(--navy-3); }
  .btn[disabled]{ opacity:.6; cursor:not-allowed; }
  [hidden]{ display:none !important; }
  @media (prefers-reduced-motion: reduce){ .mark{ animation:none; } }
</style>
</head>
<body>

  <div class="card">
    <div id="state-loading">
      <div class="mark" aria-hidden="true"></div>
      <h1>Checking your link…</h1>
    </div>

    <div id="state-form" hidden>
      <h1>Set a new password</h1>
      <p id="for-email"></p>
      <form id="reset-form">
        <label for="password">New password</label>
        <input id="password" type="password" minlength="8" placeholder="At least 8 characters" required>
        <button type="submit" id="reset-btn" class="btn">Set new password</button>
      </form>
    </div>

    <div id="state-success" hidden>
      <div class="check" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M4 12.5 9.5 18 20 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h1>Your password has been reset</h1>
      <p>Taking you to log in…</p>
    </div>

    <div id="state-error" hidden>
      <div class="check err-icon" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
      </div>
      <h1>This link didn't work</h1>
      <p id="error-text">It may have expired or already been used.</p>
      <a class="btn" href="forgot-password.html">Request a new link</a>
    </div>
  </div>

<script type="module">
  import { auth } from "./assets/firebase-config.js";
  import { verifyPasswordResetCode, confirmPasswordReset } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  const params = new URLSearchParams(window.location.search);
  const oobCode = params.get("oobCode");
  const mode = params.get("mode");

  const loading = document.getElementById("state-loading");
  const formState = document.getElementById("state-form");
  const success = document.getElementById("state-success");
  const errorState = document.getElementById("state-error");
  const errorText = document.getElementById("error-text");
  const forEmail = document.getElementById("for-email");

  async function init(){
    if (mode !== "resetPassword" || !oobCode) {
      loading.hidden = true;
      errorText.textContent = "This reset link is missing or invalid.";
      errorState.hidden = false;
      return;
    }
    try {
      const email = await verifyPasswordResetCode(auth, oobCode);
      forEmail.textContent = "for " + email;
      loading.hidden = true;
      formState.hidden = false;
    } catch (err) {
      loading.hidden = true;
      errorText.textContent = err.message.replace("Firebase: ", "");
      errorState.hidden = false;
    }
  }

  document.getElementById("reset-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("reset-btn");
    const password = document.getElementById("password").value;
    btn.disabled = true;
    btn.textContent = "Saving…";
    try {
      await confirmPasswordReset(auth, oobCode, password);
      formState.hidden = true;
      success.hidden = false;
      setTimeout(() => { window.location.href = "login.html"; }, 2200);
    } catch (err) {
      btn.disabled = false;
      btn.textContent = "Set new password";
      alert(err.message.replace("Firebase: ", ""));
    }
  });

  init();
</script>
</body>
</html>
