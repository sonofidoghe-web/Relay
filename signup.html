<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account — Relay</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/splash.css">
<style>
  :root{
    --navy:#0E2A52; --navy-2:#153E78; --navy-3:#1E4F94;
    --ink:#101828; --ink-soft:#5C6577; --bg:#F5F7FA; --card:#FFFFFF;
    --amber:#F5A623; --line:rgba(16,24,40,0.10);
  }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; display:flex; flex-direction:column; }
  h1,h2{ font-family:'Fredoka',sans-serif; font-weight:600; margin:0; letter-spacing:-0.01em; }
  a{ color:inherit; }

  .hero{ background:linear-gradient(160deg, var(--navy) 0%, var(--navy-3) 100%); color:#fff;
    padding:34px 24px 78px; position:relative; overflow:hidden; }
  .hero::after{ content:""; position:absolute; right:-60px; top:-60px; width:260px; height:260px;
    border-radius:44% 56% 60% 40% / 50% 45% 55% 50%; background:rgba(255,255,255,0.06); }
  .hero-top{ display:flex; align-items:center; justify-content:space-between; position:relative; z-index:1; max-width:420px; margin:0 auto; }
  .brand{ display:flex; align-items:center; gap:9px; font-family:'Fredoka',sans-serif; font-weight:600; font-size:1.12rem; text-decoration:none; color:#fff; }
  .brand-mark{ width:26px; height:26px; border-radius:38% 62% 60% 40% / 45% 40% 60% 55%; background:var(--amber); }
  .hero-top a.back{ font-size:0.9rem; color:rgba(255,255,255,0.75); text-decoration:none; }
  .hero-copy{ max-width:420px; margin:34px auto 0; position:relative; z-index:1; }
  .hero-copy h1{ font-size:1.7rem; color:#fff; }
  .hero-copy p{ margin-top:8px; color:rgba(255,255,255,0.72); font-size:0.98rem; }

  main{ flex-grow:1; padding:0 20px 60px; margin-top:-52px; position:relative; z-index:2; }
  .card{ max-width:420px; margin:0 auto; background:var(--card); border-radius:24px; padding:32px 26px 30px;
    box-shadow:0 24px 48px -20px rgba(14,42,82,0.25); border:1px solid var(--line); }
  .tabs{ display:flex; background:var(--bg); border-radius:100px; padding:4px; margin-bottom:26px; }
  .tab{ flex:1; text-align:center; padding:10px 0; border-radius:100px; font-size:0.92rem; font-weight:600;
    color:var(--ink-soft); text-decoration:none; transition:background .2s ease, color .2s ease; }
  .tab.active{ background:var(--navy); color:#fff; }

  label{ display:block; font-size:0.85rem; font-weight:600; color:var(--ink); margin:0 0 8px; }
  .field{ margin-bottom:18px; }
  .field input{ width:100%; padding:14px 16px; border-radius:14px; border:1.5px solid var(--line);
    font-size:0.98rem; font-family:'Inter',sans-serif; color:var(--ink); background:var(--bg); outline:none;
    transition:border-color .2s ease, background .2s ease; }
  .field input:focus{ border-color:var(--navy-3); background:#fff; }
  .field input::placeholder{ color:#A3A9B7; }
  .hint{ font-size:0.78rem; color:var(--ink-soft); margin-top:6px; }

  .btn{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:15px 20px;
    border-radius:14px; border:none; cursor:pointer; font-size:0.98rem; font-weight:700; font-family:'Inter',sans-serif;
    transition:transform .15s ease, background .2s ease; }
  .btn:active{ transform:scale(0.98); }
  .btn-primary{ background:var(--navy); color:#fff; }
  .btn-primary:hover{ background:var(--navy-3); }
  .btn[disabled]{ opacity:.65; cursor:not-allowed; }
  .btn-google{ background:#fff; color:var(--ink); border:1.5px solid var(--line); margin-top:12px; }
  .btn-google:hover{ border-color:#C7CCD6; background:#FAFBFC; }

  .divider{ display:flex; align-items:center; gap:12px; margin:24px 0; color:var(--ink-soft); font-size:0.82rem; }
  .divider::before, .divider::after{ content:""; flex:1; height:1px; background:var(--line); }
  .footer-note{ text-align:center; font-size:0.9rem; color:var(--ink-soft); }
  .footer-note a{ color:var(--navy-3); font-weight:700; text-decoration:none; }
  .footer-note a:hover{ text-decoration:underline; }

  .msg{ display:none; align-items:flex-start; gap:10px; font-size:0.86rem; font-weight:500; line-height:1.4;
    padding:12px 14px; border-radius:12px; margin-bottom:18px; }
  .msg.show{ display:flex; }
  .msg-ok{ background:#E7F7EE; color:#0F6B3C; border:1px solid #BFE9D2; }
  .msg-err{ background:#FDECEC; color:#B3261E; border:1px solid #F6C4C1; }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-top">
    <a href="index.html" class="brand"><span class="brand-mark"></span>Relay</a>
    <a href="index.html" class="back">← Back to site</a>
  </div>
  <div class="hero-copy">
    <h1>Create your account</h1>
    <p>Set up Relay and connect your first channel in a couple of minutes.</p>
  </div>
</header>

<main>
  <div class="card">
    <div class="tabs">
      <a href="login.html" class="tab">Log in</a>
      <a href="signup.html" class="tab active">Create account</a>
    </div>

    <div id="msg" class="msg" role="status"></div>

    <form id="signup-form">
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" type="email" placeholder="you@business.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required>
        <div class="hint">Use at least 8 characters.</div>
      </div>

      <button type="submit" id="signup-btn" class="btn btn-primary">Create account</button>
    </form>

    <div class="divider">or</div>

    <button type="button" id="google-btn" class="btn btn-google">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.87 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.81.54-1.85.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.66 9c0-.59.1-1.17.29-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l2.99-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
      Continue with Google
    </button>

    <p class="footer-note" style="margin-top:18px;">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</main>

<script type="module">
  import { auth, googleProvider, siteUrl } from "./assets/firebase-config.js";
  import {
    createUserWithEmailAndPassword,
    sendEmailVerification,
    signInWithPopup
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  const form = document.getElementById("signup-form");
  const btn = document.getElementById("signup-btn");
  const googleBtn = document.getElementById("google-btn");
  const msg = document.getElementById("msg");

  function showMessage(text, kind){
    msg.textContent = text;
    msg.className = "msg show " + (kind === "ok" ? "msg-ok" : "msg-err");
  }

  function friendlyError(err){
    switch(err.code){
      case "auth/email-already-in-use": return "An account with that email already exists — try logging in instead.";
      case "auth/invalid-email": return "That email address doesn't look right.";
      case "auth/weak-password": return "Please choose a password with at least 8 characters.";
      default: return err.message.replace("Firebase: ", "");
    }
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    btn.disabled = true;
    btn.textContent = "Creating account…";
    try {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      await sendEmailVerification(cred.user, { url: siteUrl("verify-email.html") });
      showMessage("Account created. Sending your confirmation link…", "ok");
      setTimeout(() => {
        window.location.href = "check-email.html?email=" + encodeURIComponent(email);
      }, 900);
    } catch (err) {
      showMessage(friendlyError(err), "err");
      btn.disabled = false;
      btn.textContent = "Create account";
    }
  });

  googleBtn.addEventListener("click", async () => {
    googleBtn.disabled = true;
    try {
      // Google accounts are already verified, so this goes straight in.
      await signInWithPopup(auth, googleProvider);
      showMessage("Account created. Redirecting…", "ok");
      setTimeout(() => { window.location.href = "index.html"; }, 1200);
    } catch (err) {
      showMessage(friendlyError(err), "err");
      googleBtn.disabled = false;
    }
  });
</script>
<script type="module" src="./assets/splash.js"></script>

</body>
</html>
